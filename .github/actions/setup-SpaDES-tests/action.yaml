
name: 'SpaDES test set up'
author: 'Susan Murray'

inputs:
  r-version:
    required: true
    type: string
    default: 'release'

runs:
  using: 'composite'
  steps:

    - uses: actions/checkout@v4

    - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

    - name: Install extra Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt -y install libfontconfig1-dev libmagick++-6.q16-dev
      shell: bash

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true
        Ncpus: 2

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::testthat

    - uses: PredictiveEcology/actions/install-Require@v0.2
      with:
        GitTag: 'development'

    - uses: PredictiveEcology/actions/install-SpaDES@v0.2

    - name: Install SpaDES.project
      run: |
        Require::Require("SpaDES.project", require = FALSE, repos = unique(c("predictiveecology.r-universe.dev", getOption("repos"))))
      shell: Rscript {0}

